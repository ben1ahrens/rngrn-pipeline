name: tests

# MANUAL ONLY. Actions minutes are metered on private repos, and when the account's
# billing is unavailable GitHub skips the job and reports it as a *failure* that has
# nothing to do with the code. The authoritative test run is the local pre-push hook
# (`git config core.hooksPath .githooks`); see the README.
#
# To restore automatic CI — once billing is sorted, or if this repo goes public —
# uncomment the push/pull_request triggers below.
on:
  # push:
  #   branches: [main]
  # pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Some CI containers forbid pthread_setaffinity_np, which makes torch abort on
      # import with "OMP: Error #179". Harmless elsewhere. See tests/conftest.py.
      KMP_AFFINITY: disabled
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q

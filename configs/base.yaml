# base.yaml — shared defaults. Concrete experiments compose this via `_base_: [base.yaml]`.
data:
  source: reference          # 'reference' | 'cache' | 'hdf5_3gene'
  system: schnakenberg
  cache_root: data/cache
  datasets_root: data/datasets    # the dataset registry (stored/downloaded sets)
  L: 100.0
  resolution: 128
  seed: 0

model:
  architecture: gated_promoter
  N: 2
  m: 2
  form: competitive
  n_hill: 2
  seed: 0

loss:
  strategy: fixed            # 'fixed' | 'scheduled' | 'gradnorm' | 'ntk'
  weights: {kstar: 1.0, turing: 1.0, resid: 0.3, anticollapse: 0.5, morphology: 0.1}
  tau: 0.12
  jac_floor: 1.0

train:
  n_restarts: 4
  adam_steps: 1500
  adam_lr: 0.05
  lbfgs_steps: 50
  grad_clip: 10.0
  seed: 0

solver:
  integrator: etdrk4         # 'etdrk4' | 'imex_split' | 'bdf1_newton_krylov'
  n_grid: 128
  horizon_growth_times: 40.0
  noise: 0.01
  robustness_samples: 200
  robustness_sigma_log: 0.1

tracking:
  backend: noop
  project: rngrn-inverse-turing
  run_name: run
  index_backend: jsonl            # run index + dataset registry index: jsonl | sqlite

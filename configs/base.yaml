# base.yaml — shared defaults. Concrete experiments compose this via `_base_: [base.yaml]`.
data:
  source: reference          # 'reference' | 'cache' | 'hdf5_3gene'
  system: schnakenberg
  cache_root: data/cache
  datasets_root: data/datasets    # the dataset registry (stored/downloaded sets)
  L: 100.0
  resolution: 128
  seed: 0

model:
  architecture: gated_promoter
  N: 2
  m: 2
  form: competitive
  n_hill: 2
  # model.seed is DELIBERATELY UNSET. It is an OVERRIDE meaning "hold the model init fixed
  # while varying something else"; left unset, recovery derives the init seed from
  # train.seed. Pinning it to 0 here made train.seed a NO-OP for every config composing this
  # base: three runs at train.seed 0/1/2 returned bit-identical loss, k* and D to 12 digits,
  # so a K-seed replicate was K identical recoveries and cross-seed reproducibility --- the
  # project's primary metric --- measured nothing. Do not reintroduce it.
  # See config.py ModelConfig.seed and docs/DECISIONS.md D-EVID-4.

loss:
  strategy: fixed            # 'fixed' | 'scheduled' | 'gradnorm' | 'ntk'
  # resid: 0.0 is SETTLED OFF (exp06: 9 cells x 8 seeds all collapsed) — see config.py.
  # anchor: the frame-scale anchor promoted from exp05. Weight 2.0 is [TUNE], never swept.
  weights: {kstar: 1.0, turing: 1.0, resid: 0.0, anticollapse: 0.5, anchor: 2.0, morphology: 0.1}
  tau: 0.12
  jac_floor: 1.0

train:
  n_restarts: 4
  adam_steps: 1500
  adam_lr: 0.05
  lbfgs_steps: 50
  grad_clip: 10.0
  seed: 0

solver:
  integrator: etdrk4         # 'etdrk4' | 'imex_split' | 'bdf1_newton_krylov'
  n_grid: 128
  horizon_growth_times: 40.0
  noise: 0.01
  robustness_samples: 200
  robustness_sigma_log: 0.1

tracking:
  backend: noop
  project: rngrn-inverse-turing
  run_name: run
  index_backend: jsonl            # run index + dataset registry index: jsonl | sqlite

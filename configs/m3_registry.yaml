# Milestone 3 (registry) — N=3 recovery from the registered three_gene_val dataset.
# Fully observed (m=3). This is the first REAL-data recovery config, as opposed to
# milestone3_3gene.yaml which points at a loose unpacked HDF5 path.
_base_: [base.yaml]
data:
  source: registry
  dataset_id: three_gene_val
  sample_key: sample_0000
  L: 100.0
model: {N: 3, m: 3, observed_idx: [0, 1, 2]}
train: {adam_steps: 2000, n_restarts: 4}
tracking: {run_name: m3_registry}

# Milestone 3 (registry) — N=3 recovery from a registered dataset, fully observed (m=3).
#
# The default dataset_id was `three_gene_val` until 2026-08-10. That is a LEGACY set: its
# domain size encodes k* exactly (L = 6*2pi/k*), so an image-blind predictor beats recovery
# on kstar_rel_err and PREREGISTRATION §1 bars it from supporting any k* claim. It now points
# at the canonical training source instead (D-CANON-4).
#
# Callers that want a different set pass --dataset-id; scripts/tune_comp_cell.sh and
# scripts/c2_cell.sh both do, so this default is a starting point, not a constraint.
_base_: [base.yaml]
data:
  source: registry
  dataset_id: turing_spots
  sample_key: sample_0000
  # no L here: the sample's own L attr is authoritative (this dataset spans many
  # domain sizes). Set data.L_override only to cross-check one specific sample.
model: {N: 3, m: 3, observed_idx: [0, 1, 2]}
train: {adam_steps: 2000, n_restarts: 4}
tracking: {run_name: m3_registry}

# Milestone 3 — N=3 from the 3-gene HDF5 dataset, nc1 (non-competitive) recovery form.
# Point hdf5_path at the unpacked dataset. Mirrors milestone3_3gene.yaml with model.form
# overridden to nc1.
_base_: [base.yaml]
data:
  source: hdf5_3gene
  hdf5_path: data/three_gene_dataset/val.h5
  sample_key: sample_0000
  # no L here: the sample's own L attr is authoritative (this dataset spans many
  # domain sizes). Set data.L_override only to cross-check one specific sample.
model: {N: 3, m: 3, form: nc1, observed_idx: [0, 1, 2]}
train: {adam_steps: 2000}
tracking: {run_name: nc1_m3_3gene}

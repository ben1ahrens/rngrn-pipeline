# Load a REGISTERED dataset by name (generated/downloaded elsewhere, stored via
# `rngrn register-data`). final_frame is the observable; jacobian/x_star/D/kstar are
# quarantined as the answer key by the firewall gate.
_base_: [base.yaml]
data:
  source: registry
  datasets_root: data/datasets
  dataset_id: three_gene_v1     # must match a registered id (see: rngrn list-datasets)
  sample_key: sample_0000
  L: 100.0
model: {N: 3, m: 3, observed_idx: [0, 1, 2]}
tracking: {run_name: registry_3gene, index_backend: jsonl}

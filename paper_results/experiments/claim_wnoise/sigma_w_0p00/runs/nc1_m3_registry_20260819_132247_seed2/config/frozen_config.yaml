data:
  source: registry
  system: schnakenberg
  dataset_hash: null
  cache_root: data/cache
  datasets_root: data/datasets
  dataset_id: three_gene_qvar
  hdf5_path: null
  sample_key: sample_0001
  L: 100.0
  L_override: null
  resolution: 128
  T_max: 4000.0
  dt: 0.1
  seed: 0
  obs_noise_sigma: 0.0
  obs_noise_seed: null
model:
  architecture: gated_promoter
  N: 3
  m: 3
  form: nc1
  n_hill: 2
  seed: null
  observed_idx:
  - 0
  - 1
  - 2
  nondim: false
  dispersion_backend: cubic
  init: default
  d_init_from_kstar: false
loss:
  weights:
    kstar: 8.0
    turing: 8.0
    resid: 0.0
    anticollapse: 0.5
    anchor: 2.0
    morphology: 0.1
    param_prior: 1.0
  strategy: fixed
  tau: 0.12
  jac_floor: 1.0
  split_hinges: true
  hinge_k_min_frac: 0.1
  staging_keys:
  - turing
  staging_off_frac: 0.25
  staging_ramp_frac: 0.25
  detach_xstar: false
  dratio_centre: 7.5
  dratio_spread: 1.0
  bio_box_path: configs/bio_box.yaml
  ratio_update_every: 50
train:
  n_restarts: 64
  adam_steps: 400
  adam_lr: 0.05
  lbfgs_steps: 0
  grad_clip: 10.0
  seed: 2
  deterministic: true
  batched: true
  device: cuda
  history_every: 10
  weight_noise_sigma: 0.0
  weight_noise_seed: null
solver:
  integrator: etdrk4
  n_grid: 128
  horizon_growth_times: 40.0
  dt: null
  noise: 0.01
  robustness_samples: 200
  robustness_sigma_log: 0.1
  morphology_rollout: true
  morphology_integrator: etdrk4_rfft
  morphology_max_steps: 15000
  morphology_early_stop: true
  morphology_check_every: 200
  morphology_saturation_tol: 0.01
  morphology_saturation_window: 5
  save_plot_arrays: true
tracking:
  backend: noop
  project: rngrn-inverse-turing
  run_name: nc1_m3_registry
  index_backend: jsonl
